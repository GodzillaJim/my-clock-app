<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient circle -->
  <defs>
    <radialGradient id="grad1" cx="50%" cy="30%" r="50%">
      <stop offset="0%" style="stop-color:#4FC3F7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2196F3;stop-opacity:1" />
    </radialGradient>
  </defs>
  <circle cx="16" cy="16" r="14" fill="url(#grad1)" stroke="#1976D2" stroke-width="1"/>
  
  <!-- Clock face -->
  <circle cx="16" cy="16" r="10" fill="none" stroke="white" stroke-width="1.5"/>
  <!-- Clock hands -->
  <line x1="16" y1="9" x2="16" y2="16" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <line x1="16" y1="16" x2="21" y2="16" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="16" cy="16" r="1" fill="white"/>
</svg>