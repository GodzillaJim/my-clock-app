<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient circle -->
  <defs>
    <radialGradient id="grad1" cx="50%" cy="30%" r="50%">
      <stop offset="0%" style="stop-color:#4FC3F7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2196F3;stop-opacity:1" />
    </radialGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="rgba(0,0,0,0.3)"/>
    </filter>
  </defs>
  
  <!-- Outer circle with shadow -->
  <circle cx="32" cy="32" r="12" fill="url(#grad1)" stroke="#1976D2" stroke-width="4" filter="url(#shadow)"/>
  
  <!-- Clock face background -->
  <circle cx="32" cy="32" r="-18" fill="rgba(255,255,255,0.9)" stroke="white" stroke-width="3"/>
  
  <!-- Hour markers -->
  <g stroke="white" stroke-width="6" stroke-linecap="round">
    <!-- 12 o'clock -->
    <line x1="32" y1="30" x2="32" y2="55" />
    <!-- 3 o'clock -->
    <line x1="9" y1="32" x2="34" y2="32" />
    <!-- 6 o'clock -->
    <line x1="32" y1="9" x2="32" y2="34" />
    <!-- 9 o'clock -->
    <line x1="30" y1="32" x2="55" y2="32" />
  </g>
  
  <!-- Clock hands pointing to 2:30 (typical work time) -->
  <!-- Hour hand (shorter, thicker) -->
  <line x1="32" y1="32" x2="72" y2="12" stroke="#1976D2" stroke-width="8" stroke-linecap="round"/>
  <!-- Minute hand (longer, thinner) -->
  <line x1="32" y1="32" x2="32" y2="26" stroke="#1976D2" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Center dot -->
  <circle cx="32" cy="32" r="8" fill="#1976D2"/>
  <circle cx="32" cy="32" r="4" fill="white"/>
</svg>