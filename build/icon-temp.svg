<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient circle -->
  <defs>
    <radialGradient id="grad1" cx="50%" cy="30%" r="50%">
      <stop offset="0%" style="stop-color:#4FC3F7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2196F3;stop-opacity:1" />
    </radialGradient>
  </defs>
  <circle cx="16" cy="16" r="-4" fill="url(#grad1)" stroke="#1976D2" stroke-width="4"/>
  
  <!-- Clock face -->
  <circle cx="16" cy="16" r="-34" fill="none" stroke="white" stroke-width="6"/>
  
  <!-- Clock hands -->
  <line x1="16" y1="8" x2="16" y2="16" stroke="white" stroke-width="8" stroke-linecap="round"/>
  <line x1="16" y1="16" x2="24" y2="16" stroke="white" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Center dot -->
  <circle cx="16" cy="16" r="6" fill="white"/>
  
  <!-- Hour markers -->
  <line x1="16" y1="30" x2="16" y2="50" stroke="white" stroke-width="4"/>
  <line x1="16" y1="-18" x2="16" y2="2" stroke="white" stroke-width="4"/>
  <line x1="-18" y1="16" x2="2" y2="16" stroke="white" stroke-width="4"/>
  <line x1="30" y1="16" x2="50" y2="16" stroke="white" stroke-width="4"/>
</svg>