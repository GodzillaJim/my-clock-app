<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient circle -->
  <defs>
    <radialGradient id="grad1" cx="50%" cy="30%" r="50%">
      <stop offset="0%" style="stop-color:#4FC3F7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2196F3;stop-opacity:1" />
    </radialGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="rgba(0,0,0,0.3)"/>
    </filter>
  </defs>
  
  <!-- Outer circle with shadow -->
  <circle cx="128" cy="128" r="108" fill="url(#grad1)" stroke="#1976D2" stroke-width="4" filter="url(#shadow)"/>
  
  <!-- Clock face background -->
  <circle cx="128" cy="128" r="78" fill="rgba(255,255,255,0.9)" stroke="white" stroke-width="3"/>
  
  <!-- Hour markers -->
  <g stroke="white" stroke-width="6" stroke-linecap="round">
    <!-- 12 o'clock -->
    <line x1="128" y1="30" x2="128" y2="55" />
    <!-- 3 o'clock -->
    <line x1="201" y1="128" x2="226" y2="128" />
    <!-- 6 o'clock -->
    <line x1="128" y1="201" x2="128" y2="226" />
    <!-- 9 o'clock -->
    <line x1="30" y1="128" x2="55" y2="128" />
  </g>
  
  <!-- Clock hands pointing to 2:30 (typical work time) -->
  <!-- Hour hand (shorter, thicker) -->
  <line x1="128" y1="128" x2="168" y2="108" stroke="#1976D2" stroke-width="8" stroke-linecap="round"/>
  <!-- Minute hand (longer, thinner) -->
  <line x1="128" y1="128" x2="128" y2="74" stroke="#1976D2" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Center dot -->
  <circle cx="128" cy="128" r="8" fill="#1976D2"/>
  <circle cx="128" cy="128" r="4" fill="white"/>
</svg>