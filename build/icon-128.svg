<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient circle -->
  <defs>
    <radialGradient id="grad1" cx="50%" cy="30%" r="50%">
      <stop offset="0%" style="stop-color:#4FC3F7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2196F3;stop-opacity:1" />
    </radialGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="rgba(0,0,0,0.3)"/>
    </filter>
  </defs>
  
  <!-- Outer circle with shadow -->
  <circle cx="64" cy="64" r="44" fill="url(#grad1)" stroke="#1976D2" stroke-width="4" filter="url(#shadow)"/>
  
  <!-- Clock face background -->
  <circle cx="64" cy="64" r="14" fill="rgba(255,255,255,0.9)" stroke="white" stroke-width="3"/>
  
  <!-- Hour markers -->
  <g stroke="white" stroke-width="6" stroke-linecap="round">
    <!-- 12 o'clock -->
    <line x1="64" y1="30" x2="64" y2="55" />
    <!-- 3 o'clock -->
    <line x1="73" y1="64" x2="98" y2="64" />
    <!-- 6 o'clock -->
    <line x1="64" y1="73" x2="64" y2="98" />
    <!-- 9 o'clock -->
    <line x1="30" y1="64" x2="55" y2="64" />
  </g>
  
  <!-- Clock hands pointing to 2:30 (typical work time) -->
  <!-- Hour hand (shorter, thicker) -->
  <line x1="64" y1="64" x2="104" y2="44" stroke="#1976D2" stroke-width="8" stroke-linecap="round"/>
  <!-- Minute hand (longer, thinner) -->
  <line x1="64" y1="64" x2="64" y2="42" stroke="#1976D2" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Center dot -->
  <circle cx="64" cy="64" r="8" fill="#1976D2"/>
  <circle cx="64" cy="64" r="4" fill="white"/>
</svg>